# Test de la conversation vocale dans le simulateur iOS 27 (branche de test, jamais main).
name: Test iPhone (simulateur)

on:
  push:
    branches: [ci/ios-sim]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-sim:
    runs-on: xcode-27
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Conversation dans le simulateur
        run: bash ci/ios-sim/run.sh
        env:
          # Démarrage après une mise à jour du site : 4a6ef9e (sans garde-fou) puis la nouvelle version.
          RUNS: demarrage-ancienne demarrage-ancienne-evince demarrage-ancienne-expire demarrage demarrage-evince demarrage-expire
          OLD_REF: 4a6ef9e
          TURNS: 5
      - name: Traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-out
          path: ios-out
          retention-days: 3
